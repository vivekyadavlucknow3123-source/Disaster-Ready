services:
  backend:
    build: .
    container_name: disaster-backend
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: disaster-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: disaster_db
    ports:
      - "3306:3306"
